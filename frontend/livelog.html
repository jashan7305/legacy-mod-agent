<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job log — Legacy Mod Agent</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/css/jetbrains-mono.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.min.css" />
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/livelog.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="submit.html">
        <span class="site-header__mark">&gt;_</span>
        <span class="site-header__title">legacy mod agent</span>
      </a>
    </div>
  </header>

  <main>
    <a class="back-link" href="submit.html">&larr; back</a>

    <div class="job-meta">
      <h2 id="job-title" style="margin: 0;">Job</h2>
    </div>
    <p class="job-meta__id" id="job-id-line"></p>
    <p class="connection-line" id="connection-line">Connecting&hellip;</p>

    <div class="terminal">
      <div class="terminal__bar">
        <span class="terminal__dot terminal__dot--red"></span>
        <span class="terminal__dot terminal__dot--yellow"></span>
        <span class="terminal__dot terminal__dot--green"></span>
        <span class="terminal__label">agent output</span>
      </div>
      <div class="terminal__body" id="terminal-body"></div>
    </div>
  </main>

  <script src="js/livelog.js"></script>
</body>
</html>
